[package]
name = "portfolio"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8.0", features = ["csr"] }
leptos_router = { version = "0.8.0" }
leptos_meta = { version = "0.8.0" }
console_error_panic_hook = "0.1"
wasm-bindgen = "0.2.106"

# Profile optimizations for small WASM size in release
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
